<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klublarim · Registan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --card: var(--tg-theme-bg-color, #ffffff);
    --ink: var(--tg-theme-text-color, #101828);
    --muted: var(--tg-theme-hint-color, #667085);
    --accent: var(--tg-theme-button-color, #1f4fd1);
    --accent-ink: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #1f4fd1);
    --line: rgba(127, 127, 127, .18);
    --ok: #12b76a; --wait: #f79009; --bad: #f04438;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "SF Pro Text", Roboto, "Segoe UI", Inter, Arial, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; gap: 10px; padding: 6px 4px 12px; }
  .top h1 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.2; }
  .top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .lang button { border: 0; background: var(--card); padding: 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .banner { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 10px; background: var(--card); border-left: 3px solid var(--accent); }
  .banner.closed { border-left-color: var(--muted); color: var(--muted); }
  .day { display: grid; gap: 4px; }
  .day .h { display: flex; align-items: center; gap: 8px; }
  .day .dn { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .day .today { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 1px 7px; border-radius: 999px; }
  .day .cn { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .day .meta { color: var(--muted); font-size: 13px; }
  .day.lesson { opacity: .55; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .b { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--line); }
  .b.ok { color: #067647; background: rgba(18, 183, 106, .14); }
  .b.wait { color: #b54708; background: rgba(247, 144, 9, .15); }
  .b.bad { color: #b42318; background: rgba(240, 68, 56, .14); }
  .att { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .bar { flex: 1; height: 5px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .next { font-size: 13px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  .next b { font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--link); padding: 8px 0; }
  .btn.sec { background: var(--line); color: var(--ink); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .day .btn { margin-top: 8px; align-self: flex-start; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .opt .t { flex: 1; min-width: 0; }
  .opt .t b { display: block; font-weight: 600; }
  .opt .t small { color: var(--muted); font-size: 12.5px; }
  .opt .s { flex: none; text-align: right; font-size: 12.5px; color: var(--muted); min-width: 64px; }
  .opt .s .bar { margin-top: 4px; }
  .opt .s .bar i { background: var(--accent); }
  .opt.sel { outline: 2px solid var(--accent); }
  .opt:disabled { opacity: .45; }
  .sec-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 4px 8px; }
  input.code { width: 100%; font-size: 26px; letter-spacing: .45em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); margin: 10px 0; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 0; font-weight: 600; cursor: pointer; }
  .err { color: var(--bad); font-size: 13.5px; min-height: 18px; margin-top: 6px; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .skel { height: 96px; border-radius: 14px; margin-bottom: 10px; background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  body.has-bar .toast { bottom: calc(84px + env(safe-area-inset-bottom)); }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #101828; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 9; max-width: 90vw; }
  .stale { font-size: 12px; color: var(--muted); text-align: center; margin: -4px 0 8px; }
  /* Ustoz kabineti */
  body.has-bar .app { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .savebar .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .savebar b { flex: 1; font-size: 13.5px; font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 10px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grp { cursor: pointer; }
  .grp .row { margin-top: 6px; }
  .list { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
  .li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li.chg { background: rgba(31, 79, 209, .06); }
  .li .n { flex: none; width: 22px; color: var(--muted); font-size: 12.5px; text-align: right; }
  .li .who { flex: 1; min-width: 0; }
  .li .who b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.25; }
  .li .who small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li.wrap { flex-wrap: wrap; }
  .mk { display: inline-flex; gap: 6px; flex: none; }
  .mk button { width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-size: 15px; cursor: pointer; color: var(--muted); }
  .mk button.k[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mk button.y[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  .mk button.s[aria-pressed="true"] { background: var(--wait); border-color: var(--wait); color: #fff; }
  input.reason, input.topic { width: 100%; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
  input.reason { margin-left: 32px; width: calc(100% - 32px); border-color: var(--bad); }
  .cal .top2 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .cal .top2 b { flex: 1; }
  .cal.today { outline: 2px solid var(--accent); }
  select.pick { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 15px; margin-bottom: 10px; }
  .tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .tools select { flex: 1; min-width: 0; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .b.acc { color: var(--accent-ink); background: var(--accent); }
  /* Rahbariyat statistikasi */
  .seg.two { grid-template-columns: 1fr 1fr; }
  .upd { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin: -2px 4px 10px; }
  .upd button { border: 0; background: none; color: var(--link); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px 0; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 12px; min-width: 0; }
  .kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .v { font-size: 26px; font-weight: 800; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .kpi .bar { margin-top: 8px; }
  .kpi .bar i { background: var(--accent); }
  .ch h3 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
  .ch .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .hb { padding: 5px 0; }
  .hb .t { display: flex; gap: 8px; font-size: 13.5px; align-items: baseline; }
  .hb .t span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .t small { color: var(--muted); font-size: 12px; }
  .hb .t b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hb .tr { position: relative; height: 8px; border-radius: 4px; background: var(--line); margin-top: 4px; }
  .hb .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .hb .tr .ref { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .35; }
  .stk { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--card); margin: 4px 0 10px; }
  .stk i { display: block; height: 100%; }
  .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .lg span { display: inline-flex; align-items: center; gap: 6px; }
  .lg span::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .al { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .al:first-of-type { border-top: 0; }
  .al .ic { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .al .ic.wait { background: rgba(247, 144, 9, .15); color: #b54708; }
  .al .ic.bad { background: rgba(240, 68, 56, .14); color: #b42318; }
  .al .ic.ok { background: rgba(18, 183, 106, .14); color: #067647; }
  .al .tx { flex: 1; min-width: 0; }
  .al b { font-variant-numeric: tabular-nums; }
  svg.cols { display: block; width: 100%; height: auto; overflow: visible; }
  svg.cols text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  svg.cols text.v { fill: var(--ink); font-weight: 600; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 8px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .tbl td.num, .tbl th.num { text-align: right; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl .w { color: #b54708; font-weight: 700; } .tbl .x { color: #b42318; font-weight: 700; }
  details.cls { border-top: 1px solid var(--line); padding: 8px 0; }
  details.cls summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  details.cls p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .tip { position: absolute; z-index: 20; background: #101828; color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 9px; border-radius: 8px; pointer-events: none; max-width: 240px; }
</style>
</head>
<body>
<div class="app" id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<script>
(function () {
  /* ===== Sozlama: Apps Script veb-ilova manzili ===== */
  const API = 'https://script.google.com/macros/s/AKfycbylNvBLF6cUZWDs5wRolL4CwSNsFNEfprH9EvyDtF5SVd_NSkpLTX-a984FJl7ggBzfvw/exec';

  const tg = window.Telegram && window.Telegram.WebApp;
  const INIT = tg && tg.initData ? tg.initData : '';
  const DEMO = !INIT && /[?&]demo/.test(location.search);
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  const $app = document.getElementById('app');
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  /* ===== Til ===== */
  const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
  let LANG = store.get('mini_lang') || (/^ru/.test(tgLang || '') ? 'ru' : 'uz');
  const L = (uz, ru) => LANG === 'ru' ? ru : uz;
  const DAY_RU = { Dushanba: 'Понедельник', Seshanba: 'Вторник', Chorshanba: 'Среда', Payshanba: 'Четверг', Juma: 'Пятница' };
  const DAY_IN_RU = { Dushanba: 'понедельник', Seshanba: 'вторник', Chorshanba: 'среду', Payshanba: 'четверг', Juma: 'пятницу' };
  const dn = d => L(d, DAY_RU[d] || d);
  const MON_UZ = ['yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun', 'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'];
  const MON_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const human = s => { const d = new Date(s + 'T12:00:00'); return L(d.getDate() + '-' + MON_UZ[d.getMonth()], d.getDate() + ' ' + MON_RU[d.getMonth()]); };
  const shortName = n => String(n).split(' ').slice(0, 2).join(' ');
  const room = r => L(r + '-xona', 'каб. ' + r);

  /* ===== Server ===== */
  async function api(action, extra) {
    if (DEMO) return DEMO_API(action, Object.assign({ teacher: TV.teacher || '' }, extra || {}));
    const res = await fetch(API + '?api=1', { method: 'POST', body: JSON.stringify(Object.assign({ action: action, initData: INIT, lang: LANG, teacher: TV.teacher || '' }, extra || {})) });
    return res.json();
  }

  /* ===== Holat ===== */
  let S = null, view = 'home', sub = {};
  const TV = { teacher: store.get('mini_teacher') || '', key: null, seg: 'tarkib', appr: {}, draft: {}, attDate: null, rtab: store.get('mini_rtab') || 'stats', stats: null, statsBusy: false };
  function toast(msg) { const t = el('div', 'toast', msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
  function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
  function confirmBox(text) {
    return new Promise(res => {
      if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.2')) tg.showConfirm(text, ok => res(!!ok));
      else res(window.confirm(text));
    });
  }
  function back(fn) {
    if (!tg || !tg.BackButton) return;
    tg.BackButton.offClick(back._fn || (() => {}));
    if (fn) { back._fn = fn; tg.BackButton.onClick(fn); tg.BackButton.show(); } else tg.BackButton.hide();
  }
  function setState(s) {
    S = s;
    if (s && s.ok && s.linked) store.set('mini_state', JSON.stringify(s));
    render();
  }
  async function refresh(silent) {
    try {
      const s = await api('me');
      if (!s.ok && s.error === 'auth') return renderMsg(L("Ilovani Telegram ichidan oching (bot → «Klublarim»).", 'Откройте приложение внутри Telegram (бот → «Klublarim»).'));
      setState(s);
    } catch (e) {
      if (!silent) renderMsg(L("Aloqa xatosi. Qayta urinib ko'ring.", 'Ошибка связи. Попробуйте ещё раз.'), true);
    }
  }

  /* ===== Ko'rinishlar ===== */
  function header(title, subtitle) {
    const h = el('div', 'top'); const t = el('div');
    t.appendChild(el('h1', null, title)); if (subtitle) t.appendChild(el('p', null, subtitle));
    h.appendChild(t);
    const lg = el('div', 'lang');
    [['uz', 'UZ'], ['ru', 'RU']].forEach(([k, x]) => {
      const b = el('button', null, x); b.type = 'button'; b.setAttribute('aria-pressed', String(LANG === k));
      b.onclick = () => { LANG = k; store.set('mini_lang', k); render(); api('me').then(s => { if (s && s.ok) S = s; }).catch(() => {}); };
      lg.appendChild(b);
    });
    h.appendChild(lg);
    return h;
  }
  function renderMsg(text, retry) {
    $app.textContent = '';
    $app.appendChild(header('Klublarim'));
    const c = el('div', 'card center'); c.appendChild(el('p', null, text));
    if (retry) { const b = el('button', 'btn', L('Qayta urinish', 'Повторить')); b.onclick = () => refresh(); c.appendChild(b); }
    $app.appendChild(c);
  }
  function render() {
    if (!S) return;
    document.documentElement.lang = LANG;
    $app.textContent = '';
    if (!S.linked) return view === 'nocode' ? renderNoCode() : renderLink();
    hideBar();
    if (S.role === 'staff') return renderStaff();
    if (view === 'pick') return renderPick();
    if (view === 'reg') return renderReg();
    renderHome();
  }

  function renderLink(err) {
    back(null);
    $app.appendChild(header('Klublarim', 'Registan · CLUB HOUR'));
    const c = el('div', 'card');
    c.appendChild(el('b', null, L("Akkauntni bog'lash", 'Привязка аккаунта')));
    c.appendChild(el('p', 'muted', L('Kuratoringiz bergan 6 xonali shaxsiy kodni kiriting.', 'Введите личный 6-значный код от куратора.')));
    const inp = el('input', 'code'); inp.inputMode = 'numeric'; inp.maxLength = 6; inp.autocomplete = 'one-time-code'; inp.placeholder = '••••••';
    const b = el('button', 'btn full', L("Bog'lash", 'Привязать')); b.disabled = true;
    const e = el('div', 'err', err || '');
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, ''); b.disabled = inp.value.length !== 6; e.textContent = ''; };
    b.onclick = async () => {
      b.disabled = true; b.textContent = L('Tekshirilmoqda…', 'Проверка…');
      let r = null; try { r = await api('link', { code: inp.value }); } catch (x) { r = { ok: false, message: L('Aloqa xatosi.', 'Ошибка связи.') }; }
      if (r.ok) { haptic('success'); setState(r); }
      else { haptic('error'); e.textContent = r.message || 'Xatolik'; b.textContent = L("Bog'lash", 'Привязать'); b.disabled = false; }
    };
    c.append(inp, b, e);
    const nc = el('button', 'btn ghost', L("Kodim yo'q", 'У меня нет кода'));
    nc.onclick = () => { view = 'nocode'; sub = {}; render(); };
    c.appendChild(nc);
    $app.appendChild(c);
    setTimeout(() => inp.focus(), 50);
  }

  async function renderNoCode() {
    back(() => { view = 'home'; sub = {}; render(); });
    $app.appendChild(header(L("Kodim yo'q", 'Нет кода'), L("Kurator Telegramda tasdiqlaydi", 'Куратор подтвердит в Telegram')));
    if (!sub.classes) {
      $app.appendChild(el('div', 'skel'));
      try { const r = await api('classes'); sub.classes = r.classes || {}; } catch (e) { sub.classes = {}; }
      return render();
    }
    if (sub.sent) { const c = el('div', 'card center'); c.appendChild(el('p', null, sub.sent)); $app.appendChild(c); return; }
    $app.appendChild(el('div', 'sec-title', L('Sinfingiz', 'Ваш класс')));
    const ch = el('div', 'chips');
    Object.keys(sub.classes).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(c => {
      const b = el('button', 'chip', c); b.type = 'button'; if (sub.cls === c) { b.style.background = 'var(--accent)'; b.style.color = 'var(--accent-ink)'; }
      b.onclick = () => { sub.cls = c; sub.idx = null; render(); }; ch.appendChild(b);
    });
    $app.appendChild(ch);
    if (!sub.cls) return;
    $app.appendChild(el('div', 'sec-title', L('Ismingiz', 'Ваше имя')));
    sub.classes[sub.cls].filter(x => !x.taken).forEach(x => {

    opts = opts || {};
    const r = el('div', 'hb'); r.setAttribute('data-tip', opts.tip || (label + ': ' + text));
    const t = el('div', 't'); const sp = el('span', null, label); if (small) { sp.appendChild(document.createTextNode(' ')); sp.appendChild(el('small', null, small)); }
    t.append(sp, el('b', null, text)); r.appendChild(t);

  function columns(parent, data, opts) {
    const W = 320, H = 150, top = 18, bot = 22, n = data.length, max = opts.max || Math.max(1, ...data.map(d => d.v || 0));
    const slot = W / Math.max(n, 1), bw = Math.min(34, slot * 0.6);
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'cols');
    const y = v => top + (H - top - bot) * (1 - v / max);
    const mk = (tag, a, txt) => { const e = document.createElementNS(ns, tag); Object.keys(a).forEach(k => e.setAttribute(k, a[k])); if (txt != null) e.textContent = txt; svg.appendChild(e); return e; };
    mk('line', { x1: 0, x2: W, y1: H - bot, y2: H - bot, stroke: 'currentColor', 'stroke-opacity': .25 });
    if (opts.ref != null) { mk('line', { x1: 0, x2: W, y1: y(opts.ref), y2: y(opts.ref), stroke: 'currentColor', 'stroke-opacity': .45, 'stroke-dasharray': '4 4' }); mk('text', { x: W, y: y(opts.ref) - 4, 'text-anchor': 'end' }, opts.refLabel); }
    data.forEach((d, i) => {
      const cx = slot * i + slot / 2, v = d.v == null ? 0 : d.v, h = Math.max(2, (H - top - bot) * v / max);
      const col = opts.color ? opts.color(d) : 'var(--accent)';
      const p = mk('path', { d: 'M' + (cx - bw / 2) + ' ' + (H - bot) + 'V' + (H - bot - h + 4) + 'q0 -4 4 -4h' + (bw - 8) + 'q4 0 4 4V' + (H - bot) + 'Z', fill: col });
      p.setAttribute('data-tip', d.tip || (d.x + ': ' + d.label));
      const hit = mk('rect', { x: slot * i, y: top - 16, width: slot, height: H - top - bot + 16, fill: 'transparent' }); hit.setAttribute('data-tip', d.tip || (d.x + ': ' + d.label));
      mk('text', { x: cx, y: H - bot - h - 5, 'text-anchor': 'middle', class: 'v' }, d.label);
      mk('text', { x: cx, y: H - 6, 'text-anchor': 'middle' }, d.x);
    });
    svg.style.color = 'var(--ink)'; parent.appendChild(svg);
  }

    const miss = ST.classes.filter(c => c.total > c.reg);
    if (miss.length) {
      const ym = chartCard(L('Hali yozilmaganlar', 'Ещё не записались'), (ST.students.total - ST.students.reg) + L(" o'quvchi · sinfni bosing", ' учеников · нажмите на класс'));
      miss.forEach(c => { const d = el('details', 'cls'); d.appendChild(el('summary', null, c.cls + ' — ' + (c.total - c.reg))); d.appendChild(el('p', null, c.missing.join(', '))); ym.appendChild(d); });
    }

    // Telegram
    const tg = chartCard('Telegram', '');
    const rows = [[L("O'quvchilar bog'langan", 'Ученики привязаны'), ST.telegram.students + ' / ' + ST.telegram.total], [L("Ustozlar bog'langan", 'Преподаватели привязаны'), ST.telegram.staff + ' / ' + ST.telegram.staffTotal], [L("Klub almashtirishlar (chorak)", 'Смен клубов за четверть'), ST.telegram.changes + L(' · bot orqali ', ' · через бот ') + ST.telegram.viaBot]];
    const tb2 = el('table', 'tbl'); rows.forEach(([a, b]) => { const tr = el('tr'); tr.append(el('td', null, a), el('td', 'num', b)); tb2.appendChild(tr); }); tg.appendChild(tb2);
  }

  /* ===== Namuna (brauzerda ?demo) ===== */
  const DEMO_API = (function () {
    const opts = d => ['AI club', 'Finance club', 'MUN club', 'Dream University club', 'Zakovat club', 'Debate club'].map((n, i) => ({ id: d.slice(0, 2) + i, name: n, teacher: ['Mr. Ravshan', "Mr. A'zamjon", 'Ms. Yulduz', 'Mr. Jahongir', 'Mr. Adhamjon', 'Mr. Farrux'][i], room: String(407 + i), free: i === 3 ? 0 : 25 - 5 * i % 23, cap: 25 }));
    let st = { ok: true, linked: false };
    const WEEK = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
    let staffCache = null;
    function demoStats() {
      const cls = ['9-A', '9-B', '9-C', '9-D', '10-A', '10-B', '10-C', '10-D', '11-A', '11-B'], tot = [17, 17, 23, 21, 16, 19, 24, 21, 26, 25];
      const clubs = ['IQ & Intellectual Club', 'Ecology & Social Impact Club', 'English quiz club', 'Magazine club', 'Startup club', 'Finance club', 'Press club', 'Art club', 'SAT Math club', 'Dream University club', 'Cinemood club', 'Culture connection club', 'AI club', 'Philosophy club', 'Psychology club', 'MUN club', 'Zakovat club', 'Chess club', 'Public speaking club', 'Debate club'];
      const tch = ['Mr. Hikmatulloh', 'Mr. Dilshod', "Mr. A'zamjon", 'Ms. Dilnura', 'Mr. Jahongir', 'Ms. Mohinur', 'Mr. Ravshan', 'Ms. Yulduz', 'Mr. Adhamjon', 'Mr. Farrux'];
      return { at: '12.11 09:40', chorak: '2-chorak', today: '2026-11-12', window: { open: true, end: '15.11 23:59' },
        students: { total: 209, reg: 196, pct: 94 },
        classes: cls.map((c, i) => ({ cls: c, total: tot[i], reg: tot[i] - [0, 1, 2, 0, 1, 3, 0, 2, 4, 0][i], missing: Array.from({ length: [0, 1, 2, 0, 1, 3, 0, 2, 4, 0][i] }, (_, j) => 'Namuna ' + (j + 1)) })),
        groups: { count: 40, seats: 784, cap: 1000, pct: 78, full: 6, few: 3, empty: 1 },
        approvals: { ok: 702, wait: 71, bad: 11 },
        attendance: { k: 1418, y: 171, s: 44, pct: 87, due: 48, held: 44, missing: 4, today: 9, todayDone: 2,
          weeks: [['2026-11-09', 91], ['2026-11-16', 86], ['2026-11-23', 84], ['2026-11-30', 78], ['2026-12-07', 88]].map(([w, p]) => ({ week: w, k: p * 4, m: 400, pct: p })) },
        risk: { count: 3, list: [{ cls: '10-B', name: 'Namuna Bir', club: 'Chess club', day: 'Seshanba', k: 2, m: 5, pct: 40 }, { cls: '9-C', name: 'Namuna Ikki', club: 'Art club', day: 'Juma', k: 3, m: 5, pct: 60 }, { cls: '11-A', name: 'Namuna Uch', club: 'MUN club', day: 'Dushanba', k: 3, m: 4, pct: 75 }] },
        clubs: clubs.map((n, i) => ({ name: n, teacher: tch[Math.floor(i / 2)], n: [50, 21, 38, 30, 47, 50, 22, 44, 49, 50, 41, 26, 50, 33, 46, 40, 35, 29, 42, 36][i], cap: 50, wait: i % 5 === 0 ? 7 : i % 3, att: [92, 88, 85, 79, 90, 94, 83, 76, 89, 91, 86, 81, 95, 87, 90, 84, 88, 72, 85, 89][i] })),
        teachers: tch.map((t, i) => ({ name: t, groups: 4, n: 60 + i * 9 % 40, wait: [7, 2, 0, 9, 1, 0, 3, 14, 0, 2][i], missing: [0, 1, 0, 2, 0, 0, 0, 1, 0, 0][i], att: [90, 82, 92, 80, 90, 84, 91, 87, 80, 87][i] })),
        days: ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma'].map((d, i) => ({ day: d, groups: 8, students: [168, 151, 160, 149, 156][i] })),
        telegram: { students: 41, total: 196, staff: 4, staffTotal: 11, changes: 23, viaBot: 9 } };
    }
    function staffDemo(boss, teacher) {
      const q = { start: '2026-11-09', end: '2026-12-26', holidays: ['2026-12-08'] }, today = '2026-11-18';
      const datesFor = day => { const out = [], d = new Date(q.start + 'T12:00:00'), e = new Date(q.end + 'T12:00:00'); while (d <= e) { const s = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); if (WEEK[d.getDay()] === day && q.holidays.indexOf(s) === -1) out.push(s); d.setDate(d.getDate() + 1); } return out; };
      if (!staffCache) {
        const C = [['RV1', 'AI club', 'Dushanba', '419'], ['RV1', 'AI club', 'Chorshanba', '419'], ['RV2', 'Philosophy club', 'Seshanba', '408'], ['RV2', 'Philosophy club', 'Payshanba', '408']];
        const cl = ['9-B', '9-C', '10-A', '10-B', '11-A', '11-B'];
        staffCache = C.map(([id, name, day, rm], j) => {
          const students = Array.from({ length: 10 + j * 3 }, (_, i) => ({ cls: cl[i % 6], name: 'Namuna' + (i + 1) + " O'quvchi " + (i % 2 ? "Ali o'g'li" : 'Vali qizi'),
            approval: j === 0 ? (i < 7 ? 'Tasdiqlandi' : (i === 7 ? 'Rad etildi' : '')) : 'Tasdiqlandi', note: i === 7 && j === 0 ? 'Boshqa klub mosroq' : '' }));
          const dates = datesFor(day), marks = {}, plan = {};
          dates.filter(d => d < today).forEach((d, w) => { if (j === 1) return; marks[d] = {}; students.filter(s => s.approval !== 'Rad etildi').forEach((s, i) => { marks[d][s.cls + '|' + s.name] = (i + w) % 6 === 0 ? 'Kelmadi' : 'Keldi'; }); });
          if (j === 0) { plan[dates[0]] = "Kirish: sun'iy intellekt nima?"; plan[dates[1]] = 'Prompt asoslari: rol, kontekst, format'; }
          return { key: id + '@' + day, clubId: id, name: name, teacher: 'Mr. Ravshan', day: day, room: rm, capacity: 25, students: students, marks: marks, dates: dates, plan: plan };
        });
      }
      const who = boss ? (teacher || '') : 'Mr. Ravshan';
      return { ok: true, linked: true, role: 'staff', name: boss ? 'Uchqun Vohidov' : 'Mr. Ravshan',
        staff: { ok: true, user: { name: boss ? 'Uchqun Vohidov' : 'Mr. Ravshan', role: boss ? 'rahbar' : 'ustoz' }, teacher: who,
          teachers: ['Mr. Adhamjon', "Mr. A'zamjon", 'Mr. Ravshan', 'Ms. Yulduz'], chorak: '2-chorak, 2026–2027',
          days: ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma'], today: today, quarter: q, sessions: who === 'Mr. Ravshan' ? staffCache : [] } };
    }
    const full = () => ({ ok: true, linked: true, role: 'student', name: "Namuna O'quvchi Ali o'g'li", cls: '10-C', chorak: '2-chorak, 2026–2027', busy: 'Juma', registered: true, today: '2026-11-16',
      window: { open: true, end: '15.11 23:59' },
      days: ['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma'].map((d, i) => d === 'Juma' ? { day: d, lesson: true } : { day: d, clubId: d.slice(0, 2) + i, club: { name: opts(d)[i].name, teacher: opts(d)[i].teacher, room: opts(d)[i].room }, status: ['Tasdiqlandi', '', 'Tasdiqlandi', 'Rad etildi'][i], used: i === 2, att: { k: [2, 1, 2, 0][i], n: [2, 2, 2, 0][i] }, next: { date: ['2026-11-16', '2026-11-17', '2026-11-18', '2026-11-19'][i], topic: i === 0 ? "Prompt asoslari: rol, kontekst, format" : '' } }),
      options: Object.fromEntries(['Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba'].map(d => [d, opts(d)])) });
    return (action, x) => new Promise(res => setTimeout(() => {
      if (action === 'link') { if (x.code === '123456') { st = full(); res(st); } else if (x.code === '111111' || x.code === '000000') { st = staffDemo(x.code === '000000'); res(st); } else res({ ok: false, message: L('Kod topilmadi.', 'Код не найден.') }); return; }
      if (st.role === 'staff') {
        if (action === 'me') { st = staffDemo(st.staff.user.role === 'rahbar', x.teacher); return res(st); }
        if (action === 'approve') { const s = st.staff.sessions.find(z => z.clubId === x.payload.clubId && z.day === x.payload.day); x.payload.items.forEach(i => { const q = s.students.find(z => z.cls === i.cls && z.name === i.name); q.approval = i.status; q.note = i.note; }); return res(Object.assign({}, st, { saved: x.payload.items.length })); }
        if (action === 'stats') return res({ ok: true, stats: demoStats() });
        if (action === 'plan') return res({ ok: true });
        if (action === 'attend') return res({ ok: true, saved: x.payload.marks.length });
      }
      if (action === 'classes') return res({ ok: true, classes: { '10-C': [{ i: 0, name: 'Namuna Bir', taken: false }, { i: 1, name: 'Namuna Ikki', taken: true }], '9-A': [] } });
      if (action === 'request') return res({ ok: true, message: L("So'rov kuratorga yuborildi.", 'Запрос отправлен куратору.') });
      if (action === 'change') { const d = st.days.find(z => z.day === x.day); const o = st.options[x.day].find(z => z.id === x.clubId); d.clubId = o.id; d.club = { name: o.name, teacher: o.teacher, room: o.room }; d.status = ''; d.used = true; return res(st); }
      res(st);
    }, 300));
  })();

  /* ===== Ishga tushirish: oxirgi holat darhol, keyin yangilash ===== */
  if (!INIT && !DEMO) { renderMsg(L("Ilovani Telegram ichidan oching (bot → «Klublarim»).", 'Откройте приложение внутри Telegram (бот → «Klublarim»).')); return; }
  const cached = !DEMO && store.get('mini_state');
  if (cached) { try { S = JSON.parse(cached); S._stale = true; render(); } catch (e) { S = null; } }
  refresh(!!S);
})();
</script>
